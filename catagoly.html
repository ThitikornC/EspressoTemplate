    <style>
      /* Ensure mode buttons have equal size and align consistently */
      /* กริดการ์ด 3 คอลัมน์ จัดกึ่งกลางชิดบน — ตรงกับ Client.vue (.tree-container) */
      .container {
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0, 320px)) !important;
        justify-content: center !important;
        align-content: start !important;
        gap: 32px !important;
        padding: 20px 20px 60px !important;
        max-width: min(1200px, 95vw) !important;
        margin: 0 auto !important;
        min-height: 100vh !important;
      }
      .container h1 { grid-column: 1 / -1; text-align: center; margin: 24px 0 8px; }
      .container .neon-btn {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        /* ขนาดการ์ดแบบเดียวกับ .parent-box */
        width: 100% !important;
        max-width: 320px !important;
        min-height: 200px !important;
        margin: 0 !important;
        padding: 16px !important;
        box-sizing: border-box !important;
        text-align: center !important;
        white-space: normal !important;
        line-height: 1.2 !important;
      }
      /* responsive เหมือนต้นฉบับ: จอแคบ -> 2 คอลัมน์ / มือถือ -> 1 */
      @media (max-width: 768px) {
        .container { grid-template-columns: repeat(2, minmax(0, 340px)) !important; gap: 16px !important; }
      }
      @media (max-width: 560px) {
        .container { grid-template-columns: minmax(0, 340px) !important; }
      }
      /* Keep inner text readable on small screens */
      .container .neon-btn span, .container .neon-btn { font-size: clamp(1rem, 2.2vw, 1.25rem) !important; }

      /* ปุ่ม i มุมขวาบนของการ์ด — กดดูความหมายของโหมดนั้นโดยไม่เข้าไปในโหมด */
      /* ต้องเจาะจงกว่า `.container .neon-btn span` ด้านบน ไม่งั้นโดน font-size ของการ์ดทับ */
      .container .neon-btn .info-dot {
        position: absolute !important;
        top: 10px;
        right: 10px;
        width: 30px !important;
        height: 30px;
        flex: 0 0 auto;
        text-shadow: none;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        border: 2px solid #74640a;
        background: #fffef8;
        color: #74640a;
        font-family: Georgia, 'Times New Roman', serif;
        font-style: italic;
        font-weight: 700;
        font-size: 18px !important;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
        transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
        z-index: 20;
      }
      .container .neon-btn .info-dot:hover,
      .container .neon-btn .info-dot:focus-visible {
        background: #74640a;
        color: #fffef8;
        transform: scale(1.12);
        outline: none;
      }
      /* มือถือ: ขยายให้นิ้วกดโดนง่ายขึ้น */
      @media (max-width: 560px) {
        .container .neon-btn .info-dot {
          width: 36px !important;
          height: 36px;
          font-size: 20px !important;
          top: 8px;
          right: 8px;
        }
      }
      /* ── ป๊อปอัปความหมาย: ต้องพอดีทุกจอ ── */
      /* จอเตี้ย (มือถือแนวนอน / เปิด devtools) การ์ดเคยสูงเกินจนปุ่มปิดหลุดออกนอกจอ
         จึงจำกัดความสูง ให้เนื้อหาเลื่อนเอง และตรึงปุ่มปิดไว้ล่างการ์ดเสมอ */
      /* ยึด overlay ด้วย inset แทน width/height:100% — บน iOS Safari ค่า 100% อิงกับ
         viewport ตอนแถบ URL ซ่อน ทำให้การ์ดเลื่อนไปอยู่ใต้แถบเบราว์เซอร์
         (display เว้นไว้ให้ JS สลับ none/flex เอง) */
      #infoModal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
      }
      .info-card {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 500px;
        max-height: calc(100vh - 32px);
        max-height: calc(100dvh - 32px);
        background: linear-gradient(180deg, #f8f6f0 0%, #fffef8 45%, #fff8e8 55%, #f5f0e5 100%);
        border: 6px solid #74640a;
        border-radius: 20px;
        box-shadow: 1px 1px 0 #000, -8px 6px #3b3305, 0 0 30px rgba(255, 230, 160, 0.7);
        padding: clamp(18px, 4.5vw, 36px) clamp(16px, 4vw, 36px);
        box-sizing: border-box;
        overflow: hidden;
      }
      .info-body {
        flex: 1 1 auto;
        min-height: 0;          /* ให้ลูกที่ overflow เลื่อนได้จริงใน flex column */
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .info-card #infoTitle {
        color: #333;
        margin: 0 0 10px;
        font-size: clamp(20px, 5.5vw, 28px);
        text-align: center;
      }
      .info-card #infoMeaning {
        color: #555;
        margin: 0;
        font-size: clamp(14.5px, 3.8vw, 17px);
        line-height: 1.75;
        text-align: center;
      }
      .info-actions {
        flex: 0 0 auto;
        display: flex;
        justify-content: center;
        padding-top: clamp(14px, 3vw, 22px);
      }
      .info-card .info-close-btn {
        font-size: 1rem !important;
        padding: 8px 30px !important;
        min-height: 40px !important;
        margin: 0 !important;
      }

      /* ข้อมูลในป๊อปอัป */
      .info-keyword {
        display: inline-block;
        padding: 3px 14px;
        border-radius: 9999px;
        background: rgba(116, 100, 10, 0.12);
        border: 1px solid #74640a;
        color: #74640a;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      /* Mobile: make contact button flow-friendly and touchable when moved under SmartTrack */
      @media (max-width: 768px) {
        #contactButton {
          position: static !important;
          right: auto !important;
          bottom: auto !important;
          display: block !important;
          /* match the container .neon-btn sizing so contact looks identical */
          width: clamp(200px, 32vw, 360px) !important;
          min-height: clamp(72px, 9vh, 104px) !important;
          max-width: 420px !important;
          margin: 12px auto !important;
          padding: clamp(16px, 3vh, 28px) clamp(10px, 2.2vw, 16px) !important;

          border-radius: 10px !important;
          box-shadow: 0 8px 24px rgba(0,0,0,0.32) !important;
          z-index: 9999 !important;
        }
      }
    </style>

<script>
// Move the contact button to appear immediately after the SmartTrack button on small screens
(function(){
  const MOBILE_QUERY = '(max-width: 768px)';
  const mq = window.matchMedia(MOBILE_QUERY);
  const contact = document.getElementById('contactButton');
  const smart = document.getElementById('smartTrackBtn');

  function moveContact() {
    if(!contact || !smart) return;
    if(mq.matches) {
      // insert contact button right after smartTrackBtn
      const parent = smart.parentNode;
      parent.insertBefore(contact, smart.nextSibling);
      // ensure styles suitable for flow
      contact.style.position = 'static';
      contact.style.right = 'auto';
      contact.style.bottom = 'auto';
      contact.style.display = 'block';
      contact.style.width = 'calc(100% - 48px)';
      contact.style.maxWidth = '420px';
      contact.style.margin = '12px auto';
      contact.style.zIndex = '9999';
    } else {
      // restore fixed position at bottom-right
      document.body.appendChild(contact);
      contact.style.position = 'fixed';
      contact.style.right = '32px';
      contact.style.bottom = '32px';
      contact.style.width = '';
      contact.style.maxWidth = '';
      contact.style.margin = '';
      contact.style.minHeight = '';
      contact.style.padding = '';
      contact.style.fontSize = '';
      contact.style.borderRadius = '';
      contact.style.boxShadow = '';
    }
  }

  document.addEventListener('DOMContentLoaded', moveContact);
  try { mq.addListener(moveContact); } catch(e) { /* ignore */ }
})();
</script>

<script>
// เดิมดูความหมายด้วยการกดค้าง 800ms ที่ปุ่มสมาร์ทเช็ค — เปลี่ยนมาใช้ปุ่ม i บนการ์ดทุกโหมดแทน
// (กดค้างเดิมพอปล่อยนิ้วแล้วลิงก์ก็ยังพาเข้าโหมดอยู่ดี)

// ── ความหมายของแต่ละโหมด (ใช้กับปุ่ม i บนการ์ด) ──
const MODE_INFO = {
  smartcheck: {
    title: 'สมาร์ทเช็ค',
    keyword: 'Awareness',
    meaning: 'เรียนรู้จากโลกและสถานการณ์ปัจจุบัน',
  },
  numbers: {
    title: 'ตัวเลข',
    keyword: 'Numeracy',
    meaning: 'สร้างพื้นฐานการคิดและการใช้ตัวเลข',
  },
  language: {
    title: 'ภาษา',
    keyword: 'Literacy',
    meaning: 'สร้างทักษะการสื่อสารผ่านการอ่าน เขียน ฟัง และพูด',
  },
  studio: {
    title: 'สตูดิโอ',
    keyword: 'Exploration',
    meaning: 'เรียนรู้ผ่านการลงมือทำและการค้นพบ',
  },
  smarttrack: {
    title: 'สมาร์ทแทรค',
    keyword: 'Growth',
    meaning: 'ติดตามการเติบโตของผู้เรียนด้วยข้อมูล',
  },
};

// Info Modal Functions
function openInfoModal(mode) {
  const info = MODE_INFO[mode] || MODE_INFO.smartcheck;
  document.getElementById('infoTitle').innerText = info.title;
  document.getElementById('infoKeyword').innerText = info.keyword;
  document.getElementById('infoMeaning').innerText = info.meaning;
  document.getElementById('infoModal').style.display = 'flex';
}

// ปุ่ม i อยู่ในลิงก์การ์ด — ต้องกันไม่ให้กดแล้วเข้าโหมดไปด้วย
document.addEventListener('click', function(e) {
  const dot = e.target.closest('.info-dot');
  if (!dot) return;
  e.preventDefault();
  e.stopPropagation();
  openInfoModal(dot.dataset.info);
});
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const dot = e.target.closest && e.target.closest('.info-dot');
  if (!dot) return;
  e.preventDefault();
  e.stopPropagation();
  openInfoModal(dot.dataset.info);
});

function closeInfoModal() {
  document.getElementById('infoModal').style.display = 'none';
}

// Click outside to close
document.getElementById('infoModal')?.addEventListener('click', function(e) {
  if (e.target === this) {
    closeInfoModal();
  }
});

// Contact button click: open feedback modal
document.getElementById('contactButton')?.addEventListener('click', function() {
  openFeedbackModal();
});
// ...existing code...

// Feedback Modal Functions
function openFeedbackModal() {
  document.getElementById('feedbackModal').style.display = 'flex';
}

function closeFeedbackModal() {
  document.getElementById('feedbackModal').style.display = 'none';
  document.getElementById('feedbackName').value = '';
  document.getElementById('feedbackPhone').value = '';
  document.getElementById('feedbackText').value = '';
}

async function submitFeedback() {
  const feedbackName = document.getElementById('feedbackName').value.trim();
  const feedbackPhone = document.getElementById('feedbackPhone').value.trim();
  const feedbackText = document.getElementById('feedbackText').value.trim();

  if (!feedbackName) {
    alert('กรุณากรอกชื่อของคุณ');
    return;
  }
  if (!feedbackPhone) {
    alert('กรุณากรอกเบอร์โทรศัพท์ผู้ติดต่อ');
    return;
  }
  if (!feedbackText) {
    alert('กรุณากรอกข้อเสนอแนะก่อนส่ง');
    return;
  }

  try {
    const response = await fetch('/api/feedback', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        name: feedbackName,
        phone: feedbackPhone,
        feedback: feedbackText,
        timestamp: new Date().toISOString()
      })
    });

    const result = await response.json();

    if (result.success) {
      alert('✅ ส่งข้อเสนอแนะสำเร็จ!\nขอบคุณสำหรับความคิดเห็นของคุณ');
      closeFeedbackModal();
    } else {
      alert('❌ เกิดข้อผิดพลาด: ' + result.message);
    }
  } catch (error) {
    console.error('Error:', error);
    alert('❌ ไม่สามารถส่งข้อเสนอแนะได้\nกรุณาตรวจสอบว่า Server กำลังทำงานอยู่');
  }
}

// ปิด modal เมื่อคลิกนอก modal
document.getElementById('feedbackModal')?.addEventListener('click', function(e) {
  if (e.target === this) {
    closeFeedbackModal();
  }
});

// ...existing code...
</script>

<script>
// Track SmartTrack clicks similarly to other modes
;(function(){
  const btn = document.getElementById('smartTrackBtn');
  if(!btn) return;
  btn.addEventListener('click', function(e){
    try {
      // Prefer a lightweight tracking call if available
      if (window.usageTracker && typeof window.usageTracker.track === 'function') {
        try { window.usageTracker.track('smartTrack:click', { from: location.pathname || 'catagoly.html' }); } catch(e){}
      } else if (window.usageTracker && typeof window.usageTracker.start === 'function') {
        // Start a short session for SmartTrack before navigation (best-effort)
        try { window.usageTracker.start('/BMI.html', 'smart-track'); } catch(e){}
      } else {
        // fallback: record to localStorage so server-side aggregator can read it later
        try {
          const p = { event: 'smartTrack:click', from: location.pathname || 'catagoly.html', ts: new Date().toISOString() };
          const arr = JSON.parse(localStorage.getItem('localUsageEvents') || '[]');
          arr.push(p);
          localStorage.setItem('localUsageEvents', JSON.stringify(arr));
        } catch(e){}
      }
    } catch(e){}
    // allow normal navigation to proceed
  });
})();
</script>

        try {
          const cookie = document.cookie || '';
          const match = cookie.split(';').map(s=>s.trim()).find(c=>c.indexOf('huaroa_client_id=')===0);
          if (match) payload.clientId = decodeURIComponent(match.split('=')[1]||'');
        } catch(e){}
        // Use keepalive fetch so navigation is not blocked
        try {
          fetch('/api/usage/event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), keepalive: true, credentials: 'include' }).catch(()=>{});
        } catch(e) {
          // final fallback: try navigator.sendBeacon with blob
          try { navigator.sendBeacon && navigator.sendBeacon('/api/usage/event', new Blob([JSON.stringify(payload)], { type: 'application/json' })); } catch(e){}
        }
      } catch(e){}
});
</script>
</body>
